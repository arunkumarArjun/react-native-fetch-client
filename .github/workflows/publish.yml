name: Publish Package

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    name: Build, Test & Publish with Provenance
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for npm cryptographic provenance attestation (Sigstore)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Code formatting & lint checks
        run: |
          npm run format:check
          npm run lint
          npm run typecheck

      - name: Run test suite
        run: npm test

      - name: Build distribution bundles (ESM, CJS, DTS)
        run: npm run build

      - name: Publish to npm with Provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
