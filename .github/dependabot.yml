version: 2
updates:
  # Maintain dependencies for npm packages (Grouped into 1 PR, monthly)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      npm-dependencies:
        patterns:
          - "*"

  # Maintain dependencies for GitHub Actions workflows (Grouped into 1 PR, monthly)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns:
          - "*"
