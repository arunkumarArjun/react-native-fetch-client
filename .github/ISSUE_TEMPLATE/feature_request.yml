name: Feature Request
description: Suggest an idea or feature for react-native-fetch-client
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make react-native-fetch-client even better? We'd love to hear it!
  - type: textarea
    id: problem
    attributes:
      label: Problem or Use Case
      description: Is your feature request related to a problem or limitation?
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to see implemented.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you've considered.
